################################『日語假名輸入漢字』##################################
japan:
  tag: japan
  dictionary: jpnin1.extended
  # enable_charset_filter: false
  enable_completion: false
  enable_user_dict: true
  prefix: "4"
  suffix: "'"
  tips: "《純日語》▶"
  closing_tips: "◀《純日語》"
  disable_user_dict_for_patterns:
    - ^-{1,2}$
    # - ^[.]$
    # - ^[aiueohn]$
    # - ^[kstnhmrgzdbp][aiueo]$
    # - ^[sc]hi$
    # - ^tsu$
    # - ^fu$
    # - ^y[auo]$
    # - ^w[ao]$
    # - ^n$
    # - ^[kgsztnhbpmr]y[auo]$
    # - ^[sc]h[auo]$
    # - ^j[auo]$
  preedit_format:
    - xform/'[[]'?/A/
    - xform/^/《純日語》/
    - xform/^《純日語》(.+)A$/$1《純日語》/
    - xform/A//
    - "xlit|abcdefghijklmnopqrstuvwxyz|ABCDEFGHIJKLMNOPQRSTUVWXYZ|"
    - 'xform/\\/ /'
