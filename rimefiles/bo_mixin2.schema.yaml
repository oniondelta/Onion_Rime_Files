punct_mark:
  opencc_config: punct_mark.json
  option_name: punct_mark
  show_in_comment: true
  tags: [ punct ]
  tips: all
  comment_format:
    - erase/^.*〔.*〕.+$/
    - erase/^.+〔.*〕$/

en_sort_filter:
  tags: [ easy_en ]

convert_english_filter:
  tags: [ easy_en ]

convert_japan_filter:
  tags: [ japan ]

# preedit_model_charset_filter2_filter:
#   tags: [ abc ]

# mix_cf2_miss_filter:
#   tags: [ punct, reverse2_lookup ]
#   # tags: [ punct, abc, reverse2_lookup ]
################################### 選單 ######################################
menu:
  __include: element_bopomo:/menu
################################### 拼寫 ######################################
speller:
  alphabet: "1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 3467"
  initials: "1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/-"
  finals: " 6347"
  delimiter: "\\"
  use_space: true
  algebra:
##### 非正確注音（補空碼或慣用發音）轉寫 #####
    - xform/[)(]//
##### 韓文HNC轉寫開始 #####
    - derive/^(!)l/$1r/
    - derive/^(![^!]+)l/$1r/
    - derive/^(!)x/$1ng/
    - derive/^(![^!]+)x/$1ng/
    - derive/^(![^!]*)i/$1y/
    - derive/^(![^!]*)y([aueo])/$1i$2/
    - derive/^(!)p/$1f/
    - derive/^(![^!]+)p$/$1f/
##### 韓文HNC轉寫結束 #####
##### 日文轉寫開始 #####
## 符號
    - derive|^(!!)-$|$1ev|
    - derive|^(!!)[/]$|$1av|
    - derive|^(!!),,$|$1sv|
    - derive|^(!!)[.];$|$1ov|
    - derive|^(!!),;$|$1vv|
    - derive|^(!!)--$|$1eev|
    - derive|^(!!)-$|$1!ev|
    - derive|^(!!)[/]$|$1!av|
    - derive|^(!!),,$|$1!sv|
    - derive|^(!!)[.];$|$1!ov|
    - derive|^(!!),;$|$1!vv|
    - derive|^(!!)--$|$1!eev|
    - derive/^(!!)xx$/$1shime/
    - derive/^(!!)xx$/$1sime/
    - derive/^(!!)(xx)$/$1!$2/
    - derive/^(!!)(shime)$/$1!$2/
    - derive/^(!!)(sime)$/$1!$2/
    - derive/^(!!)noma$/$1dou/
    - derive/^(!!)dou$/$1onaji/
    - derive/^(!!)dou$/$1onazi/
    - derive/^(!!)dou$/$1odoriji/
    - derive/^(!!)dou$/$1odorizi/
## 小字
    - derive/^(!!!?)xtu$/$1ltu/
    - derive/^(!!!?)xtu$/$1xtsu/
    - derive/^(!!!?)xtu$/$1ltsu/
    - derive/^(!!!?)x([aeiou])/$1l$2/
    - derive/^(!!!?)x(y[auo]|wa)$/$1l$2/
    - derive/^(!!!?)xke$/$1lke/
    - derive/^(!!)xke$/$1ke/
    - derive/^(!!!?)xka$/$1lka/
    - derive/^(!!)xka$/$1ka/
## 促音+拗音
    - derive/^(!!!?)ssh([auo])$/$1ssy$2/
    - derive/^(!!!?)cch([auo])$/$1ccy$2/
    - derive/^(!!!?)cch([auo])$/$1tty$2/
    - derive/^(!!!?)jj([auo])$/$1zzy$2/ #っじゃ
    - derive/^(!!!?)jj([auo])$/$1jjy$2/ #っじゃ
    - derive/^(!!!?)ddy([auo])$/$1zzy$2/ #っぢゃ
    - derive/^(!!!?)ddy([auo])$/$1jj$2/ #っぢゃ
## 促音
    - derive/^(!!!?)cchi$/$1tti/
    - derive/^(!!!?)sshi$/$1ssi/
    - derive/^(!!!?)ffu$/$1hhu/
    - derive/^(!!!?)ttsu$/$1ttu/
    - derive/^(!!!?)jji$/$1zzi/
## 拗音
    - derive/^(!!!?)sh([auo])$/$1sy$2/
    - derive/^(!!!?)ch([auo])$/$1cy$2/
    - derive/^(!!!?)ch([auo])$/$1ty$2/
    - derive/^(!!!?)j([auo])$/$1jy$2/
    - derive/^(!!!?)j([auo])$/$1zy$2/
    - derive/^(!!!?)dy([auo])$/$1j$2/
    - derive/^(!!!?)dy([auo])$/$1zy$2/
## 一般
    - derive/^(!!!?)shi$/$1si/
    - derive/^(!!!?)chi$/$1ti/
    - derive/^(!!!?)tsu$/$1tu/
    - derive/^(!!!?)fu$/$1hu/
    - derive/^(!!!?)ji$/$1zi/
    # - derive/^(!!!?)u$/$1wu/  #少用精簡
## 特殊
    - xform/^(!!!?)dvyu$/$1dyu/ # デュ #特殊片假名被其他正則不轉寫。
##### 日文轉寫結束 #####
### 日文特殊符號轉平假名尾綴也可輸入
    # - derive/^\!\!(noma|dou|onaji|onazi|odoriji|odorizi)$/\!\!\!$1/
##### 該方案標點特殊處理 #####
##    - xform|^([!][!][!])([-.,/]+)([;])$|$1$2| #日語標點符號在此方案去掉「;」
##    - xform|^([@])([-.,/]+)([;])$|$1$2| #拉丁標點符號在此方案去掉「;」
    # - xform|^([@])([/])([;])$|$1$2| #拉丁標點符號在此方案去掉「;」
#    - xform|^([@])([/])([.])([;])$|$1$2$3| #拉丁標點符號在此方案去掉「;」
    # - derive|^([@])([.])([,])$|$1;| #拉丁標點符號在此方案改「;」
##### 把外語言轉大寫或帶符號，不被注音正則影響 #####
    - 'xlit|/;,.-|%"<>_|' #注音佔用到的五個符號鍵位 #A|
    # - 'xlit|/;,.-"|斜分逗點橫分|'
### 各語言標點、組合字符先行轉寫（標點適應方案，多轉其他編碼） ###
#    - derive/^([@])([逗點橫])$/$1分$2/ #拉丁三個標點「,.-」前加分號
#    - derive/^([!][!][!])([逗點橫])$/$1分$2/ #日語二個標點「・ー」前加分號
#    - derive/^!!!([s]?)([斜分逗點橫]+)$/!!$1$2/ #增加平假名標點
#############################################
### 拉丁 ###
    - xform|^@(%)"$|$1 | #拉丁標點符號在此方案去掉「;」
    - derive|^@><$|" | #拉丁標點符號在此方案改「;」
    - xform/^@("")([a-z]+)$/\U$2\E$1 / #轉換「拉丁組合字符」前雙分號到後面
    - xform/^@([a-z]+)"$/\U$1\E&/ #拉丁大寫
    - xform/^@([a-z]*)([%"<>_]*)$/\U$1\E$2 / #拉丁小寫和標點
    - derive/^([%"<>_]+) $/$1&/ #在此方案，拉丁標點增加可用大寫尾綴
### 日語 ###
    - xform/^!!!!([a-z]+)$/\U$1\E>>[/ #日語(濁点與半濁点)
    - derive/^([A-Z]+)>>[[]$/$1>>]/ #日語(濁点與半濁点)
    # - derive/^([A-Z]+)>>([[])$/$1<<$2/ #日語(濁点與半濁点)
    # - derive/^([A-Z]+)>>[[]$/$1<<]/ #日語(濁点與半濁点)
    - derive/^!!([%"<>_]+)$/$1[/ #增加平假名標點
    - xform/^!!([a-z]*)([%"<>_]*)$/\U$1\E$2]/ #片假名尾綴
    - xform/^!!!([a-z]*)([%"<>_]*)$/\U$1\E$2[/ #平假名尾綴
### 韓語 ###
    - xform/^!([a-z]+)(%*)$/\U$1\E$2~/ #韓語尾綴
###########
    - xform/Z/`Q/
    - xform/C/`W/
    - xform/S/`T/
    - xform/E/`Y/
    - xform/A/`P/
    - xform/I/`D/
    - xform/O/`F/
    - xform/U/`H/
    - xform/M/`J/
    - xform/N/`L/
    - xform/K/`X/
    - xform/G/`V/
    - xform/R/`B/
##### 拼音轉注音 #####
    - xform/iu/iU/ #iou
    - xform/ui/uI/ #uei
    - xform/ong/ung/
    - xform/yi?/i/
    - xform/wu?/u/
    - xform/iu/v/
    - xform/([jqx])u/$1v/
    - xform/([iuv])n/$1en/
    - xform/zhi?/Z/
    - xform/chi?/C/
    - xform/shi?/S/
    - xform/([zcsr])i/$1/
    - xform/ai/A/
    - xform/ei/I/
    - xform/ao/O/
    - xform/ou/U/
    - xform/ang/K/
    - xform/eng/G/
    - xform/an/M/
    - xform/en/N/
    - xform/er/R/
    - xform/eh/E/
    - xform/([iv])e/$1E/
##### 注音字母簡化 #####
    - abbrev/^([bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR]).+$/$1/
    - abbrev/^([bpmfdtnlgkhjqxZCSrzcsiuv])([iuvaoeEAIOUMNKG])\d$/$1$2/ #[R]
    - abbrev/^([bpmfdtnlgkhjqxZCSrzcs])([iuv])([aoeEAIOUMNKG])\d$/$1$2$3/ #[R]
##    - abbrev/^([bpmfdtnlgkhjqxZCSrzcsiuv]).+$/$1/ #derive
##    - abbrev/^([bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR]+)\d$/$1/ #derive
#    - abbrev/^([bpmfdtnlgkhjqxZCSrzcsiuv]).+(\d)$/$1$2/ #使得ㄎˇㄈˇ（可否）可以打的出來 #新增iuv，使得ㄧˊㄉˊ（贏得）可以打出
#    - abbrev/^([bpmfdtnlgkhjqxZCSrzcs]).+(\d)$/$1$2/ #同上，但少了ㄧㄨㄩ
#    - abbrev/^([bpmfdtnlgkhjqx]).+(\d)$/$1$2/ #同上，但再少了ㄓㄔㄕㄖㄗㄘㄙ
    - derive/^([bpmfdtnlgkhjqx]).+(\d)$/$1$2/
##### 內嵌注音文 #####
    - xform|^＊([12345])$|r$1| #聲調，「ㄖ」「聲調」打出聲調不被省略
    - abbrev|^＊([bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR])$|$1|
    - xform|^＊([bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR])$|$1 | #下兩則 xform 合併處理 #\x31=數字1
    # - xform|^＊([bpmfdtnlgkhjqx])$|$1 | #\x31=數字1
    # - erase|^＊([bpmfdtnlgkhjqx])$|| #消除不含聲調注音（不消除也不影響） #如果上一則為 abbrev 才需要，xform 不需要
    # - xform|^＊([ZCSrzcsiuvaoeEAIOUMNKGR])$|$1 | #\x31=數字1
    - xform|^＊＊|| #開頭「＊＊」使注音文不被前面縮略，該正則回復
##### 注音聲韻母亂序 #####
    - derive/^([bpmfdtnlgkhjqxZCSrzcs])([iuv])/$2$1/
    - derive/^([iuv])([aoeEAIOUMNKG])/$2$1/ #[R]
    - derive/^([bpmfdtnlgkhjqxZCSrzcs])([aoeEAIOUMNKG])/$2$1/ #[R]
    - derive/^([bpmfdtnlgkhjqxZCSrzcs])([iuv])([aoeEAIOUMNKG])/$3$2$1/ #[R]
    - derive/^([bpmfdtnlgkhjqxZCSrzcs])([iuv])([aoeEAIOUMNKG])/$3$1$2/ #[R]
    - derive/^([bpmfdtnlgkhjqxZCSrzcs])([iuv])([aoeEAIOUMNKG])/$2$3$1/ #[R]
    - derive/^([bpmfdtnlgkhjqxZCSrzcs])([iuv])([aoeEAIOUMNKG])/$1$3$2/ #[R]
    - 'xlit|bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR12345|1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347|'
##### 多國語言轉回正常 #####
    - xform/`Q/Z/
    - xform/`W/C/
    - xform/`T/S/
    - xform/`Y/E/
    - xform/`P/A/
    - xform/`D/I/
    - xform/`F/O/
    - xform/`H/U/
    - xform/`J/M/
    - xform/`L/N/
    - xform/`X/K/
    - xform/`V/G/
    - xform/`B/R/
    - xform/~/7/
    - xform/&/6/ #6
    - xform/[]]/4/ #4
    - xform/[[]/3/ #6=3
######################
#    - derive/^([`A-Z]+)分[ ]$/$1 / #拉丁字母大寫去掉「;」號 #測試##不使大寫轉成單「'」此條要「遮屏」#
##    - abbrev/^([`A-Z]+)分[ ]$/$1/ #測試##不使大寫轉成單「'」此條要「開啟」#
###    - abbrev/^([`A-Z]+)分[ ]$/$1/ #拉丁字母大寫簡化（下列已可簡化）
##### 多國語言簡化 #####
    - abbrev/^([%"<>_A-Z]+)[ 3467]$/$1/ #簡化外語去掉尾綴 #derive #6=3
##########################################################
    - xform/([A-Z]+)/\L$1\E/
    # - xform|>|\.| #點號
    # - xform|<|,| #逗號
    # - xform|"|;| #分號
    # - xform|%|/| #斜線
    # - xform|_|-| #連字號
    - 'xlit|><"%_|.,;/-|' #整合以上五個項目
################################### 主注音引擎 ######################################
translator:
  dictionary: bo_mixin.extended
  prism: bo_mixin2
  # enable_charset_filter: false
  enable_completion: false #新版有長詞補全，用此關閉
  enable_user_dict: true
  # initial_quality: 1
  preedit_format:
    __include: element_bopomo:/preedit_b_1_2_4
  # #### grammar 組句校正 ####
  # contextual_suggestions: true  #是否使用語言模型優化輸出結果〔需配合grammar使用〕
  # max_homophones: 7  #最大同音簇長度〔需配合grammar使用〕
  # max_homographs: 7  #最大同形簇長度〔需配合grammar使用〕
  # max_sentences: 5 #10  #支持多句子候選輸出〔需配合grammar最大同音簇長度max_homophones大於1使用〕
################################### 調出 Easy 英語 ######################################
easy_en:
  tag: easy_en
  dictionary: easy_en_lower #easy_en_super
  # enable_encoder: false
  # encode_commit_history: false
  enable_sentence: false
  enable_completion: true
  # sentence_over_completion: false
  enable_user_dict: false
